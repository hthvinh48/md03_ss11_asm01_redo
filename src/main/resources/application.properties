spring.application.name=PatientController

spring.datasource.url=jdbc:postgresql://localhost:5432/db_hospital_management
spring.datasource.username=postgres
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

logging.level.root=INFO
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.example.patientcontroller.service=TRACE

logging.file.name=logs/patient_web_service.log
logging.logback.rollingpolicy.file-name-pattern=logs/patient_web_service.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.max-history=7
